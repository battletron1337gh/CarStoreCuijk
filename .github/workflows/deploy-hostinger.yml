name: Deploy to Hostinger

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: "hostinger-deploy"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build
        run: |
          npm run build 2>&1
        env:
          NEXT_TELEMETRY_DISABLED: 1
          CI: true
        continue-on-error: false

      - name: Check dist exists
        run: |
          ls -la
          if [ -d "dist" ]; then
            ls -la dist/
            echo "Dist exists with $(ls dist/ | wc -l) files"
          else
            echo "ERROR: dist directory not found!"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          cat >> ~/.ssh/config <<EOF
          Host hostinger
            HostName ${{ secrets.HOSTINGER_HOST }}
            Port ${{ secrets.HOSTINGER_PORT }}
            User ${{ secrets.HOSTINGER_USER }}
            IdentityFile ~/.ssh/hostinger_deploy
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy to Hostinger via rsync
        run: |
          rsync -avz --progress \
            --exclude='api/' \
            --exclude='data/' \
            --exclude='vwe-fotos/' \
            --exclude='status.php' \
            --exclude='test-webhook.php' \
            --exclude='config.php' \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }} -i ~/.ssh/hostinger_deploy -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:~/domains/carstorecuijk.nl/public_html/

      - name: Verify deployment
        run: |
          echo "Deployment completed!"
          echo "Site: https://carstorecuijk.nl"
